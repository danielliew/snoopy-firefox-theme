[project]
name = "snoopy-firefox-theme"
# Tooling only; releases are versioned by theme/manifest.json and git tags.
version = "0.0.0"
description = "Build tooling for the Snoopy Vertical Firefox theme and userChrome extras"
requires-python = ">=3.12"
dependencies = ["pillow>=11"]

[dependency-groups]
dev = ["marionette-driver>=3"]

[tool.uv]
package = false

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  assets:
    name: Assets up to date and within budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run build.py check

  lint:
    name: web-ext lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx -y web-ext lint --source-dir theme --self-hosted

  userchrome:
    name: userChrome.css in headless Firefox
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: browser-actions/setup-firefox@v1
        with:
          firefox-version: latest
      - run: uv run tests/verify_userchrome.py "$(which firefox)"

  installer:
    name: install.sh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh -n install.sh

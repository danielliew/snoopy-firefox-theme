name: CI

on:
  push:
    branches: [main]
  pull_request:
  # userChrome.css styles Firefox internals that can change in any release.
  schedule:
    - cron: "0 15 * * 1"
  workflow_dispatch:

jobs:
  assets:
    name: Assets up to date and within budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - run: uv run build.py check

  lint:
    name: web-ext lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npx -y web-ext lint --source-dir theme --self-hosted

  userchrome:
    name: userChrome.css in headless Firefox
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - uses: browser-actions/setup-firefox@v1
        with:
          firefox-version: latest
      - run: uv run tests/verify_userchrome.py "$(which firefox)"

  installer:
    name: install.sh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sh -n install.sh
